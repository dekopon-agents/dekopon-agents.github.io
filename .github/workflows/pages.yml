name: Build and deploy GitHub Pages

on:
  push:
    branches:
      - main
  pull_request:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: Core release to pin (default the latest release)
        required: false
  repository_dispatch:
    types:
      - core-release

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repin:
    name: Pin the latest core release
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      sha: ${{ steps.push.outputs.sha }}
    env:
      GITHUB_TOKEN: ${{ github.token }}
      PIN_TAG: ${{ github.event.client_payload.tag || inputs.tag }}
    steps:
      - name: Check out main
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Derive the pin from the release
        id: pin
        run: node scripts/repin.mjs ${PIN_TAG:+--tag "$PIN_TAG"}

      - name: Verify the pin against its publications
        if: steps.pin.outputs.changed == 'true'
        run: npm run check:release -- --remote

      - name: Compile and validate site
        if: steps.pin.outputs.changed == 'true'
        run: npm test

      - name: Verify pinned source links
        if: steps.pin.outputs.changed == 'true'
        run: node scripts/check-pinned-links.mjs

      - name: Commit the pin to main
        id: push
        env:
          TAG: ${{ steps.pin.outputs.tag }}
          CHANGED: ${{ steps.pin.outputs.changed }}
        run: |
          if [ "$CHANGED" = true ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -qm "chore(release): pin core $TAG" -- src/_data/release.json src/_data/providerSdk.json
            git push origin HEAD:main || { git pull --rebase origin main && git push origin HEAD:main; }
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Open a PR retiring the audit exception once picomatch has a patched release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/audit-build-deps.mjs --retire
          if git diff --quiet && [ -z "$(git ls-files --deleted)" ]; then exit 0; fi
          npm ci
          npm test
          node scripts/audit-build-deps.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -qb retire-audit-exception
          git add -A package.json package-lock.json scripts
          git commit -qm "ci: retire the picomatch audit exception" -m "Changelog: Changed: Retire the build audit exception for GHSA-fc5q-39xc-vjpf now that picomatch is patched."
          git push -f origin retire-audit-exception
          gh api "repos/$GITHUB_REPOSITORY/pulls" -f base=main -f head=retire-audit-exception -f title="ci: retire the picomatch audit exception" -f body="A patched picomatch exists; this updates it and deletes scripts/audit-exception.json." || true

  build:
    name: Build static site
    needs: repin
    if: ${{ !cancelled() && needs.repin.result != 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.repin.outputs.sha || (github.event_name == 'push' && github.ref) || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Audit build dependencies
        run: node scripts/audit-build-deps.mjs

      - name: Compile and validate site
        run: npm test

      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v6

      - name: Upload static site
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site
          include-hidden-files: true

  deploy:
    name: Publish site
    if: ${{ !cancelled() && github.event_name != 'pull_request' && needs.build.result == 'success' }}
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
